name: ci

on:
  # Проверяем каждую ветку, а не только main: иначе зелёный CI виден лишь после
  # открытия PR, а поломку хочется ловить сразу после пуша.
  push:
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: обратная связь должна быть быстрой.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Файлы не отформатированы gofmt:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          # Версия пинится и ставится через go install: линтер должен быть собран
          # тем же тулчейном, что и модуль, иначе он откажется его анализировать.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: unit tests
        run: go test -race -short -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t + 0 < 60) { print "покрытие ниже порога 60%"; exit 1 } }'

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting
          POSTGRES_DB: meeting
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U meeting -d meeting"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://meeting:meeting@localhost:5432/meeting?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: integration tests
        run: go test -race -count=1 -run Integration ./...

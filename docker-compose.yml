# Локальная инфраструктура для разработки и интеграционных тестов.
# Приложение в контейнер не упаковывается: это CLI-утилита.
services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
